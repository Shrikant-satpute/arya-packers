<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#2d5a8e"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Letter A -->
  <text x="32" y="44" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="38" fill="#f59e0b" text-anchor="middle">A</text>
  <!-- Small truck icon below -->
  <rect x="18" y="48" width="28" height="3" rx="1.5" fill="#f59e0b" opacity="0.6"/>
</svg>
